name: React POC

on:
  pull_request:
    paths:
      - "frontend/**"
      - "app/api/**"
      - "app/security/api_session.py"
      - "app/services/dashboard_read_service.py"
      - "app/services/accounts_read_service.py"
      - "app/services/assets_read_service.py"
      - "app/services/transactions_read_service.py"
      - "app/services/forecast_read_service.py"
      - "app/services/budgets_read_service.py"
      - "app/services/reconciliation_read_service.py"
      - "app/services/settings_read_service.py"
      - "app/services/bank_import_workflow_service.py"
      - "tests/api/**"
      - "requirements-react-api.txt"
      - ".github/workflows/react-poc.yml"
  workflow_dispatch:

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install local API dependencies
        run: python -m pip install -r requirements-react-api.txt
      - name: Check Python contract
        env:
          VALORIA_DATA_DIR: ${{ runner.temp }}/valoria-react-poc
        run: |
          python -m compileall app/api app/services/dashboard_read_service.py app/services/accounts_read_service.py app/services/assets_read_service.py app/services/transactions_read_service.py app/services/forecast_read_service.py app/services/budgets_read_service.py app/services/reconciliation_read_service.py app/services/settings_read_service.py app/services/bank_import_workflow_service.py
          python -m unittest tests.api.test_dashboard_read_service tests.api.test_accounts_read_service tests.api.test_assets_read_service tests.api.test_transactions_read_service tests.api.test_forecast_read_service tests.api.test_budgets_read_service tests.api.test_reconciliation_read_service tests.api.test_settings_read_service tests.api.test_bank_import_workflow_service tests.api.test_api_database_startup tests.api.test_api_session
          python -c "from app.api.main import app; paths = {route.path for route in app.routes}; assert {'/api/v1/dashboard', '/api/v1/accounts', '/api/v1/accounts/{account_id}', '/api/v1/accounts/{account_id}/reference', '/api/v1/assets', '/api/v1/transactions', '/api/v1/transactions/{transaction_id}', '/api/v1/transactions/actions/bulk', '/api/v1/transactions/imports', '/api/v1/transactions/imports/preview', '/api/v1/transactions/imports/commit', '/api/v1/transactions/imports/{batch_id}/cancel', '/api/v1/forecast', '/api/v1/budgets', '/api/v1/settings', '/api/v1/settings/general', '/api/v1/settings/categories', '/api/v1/settings/rules', '/api/v1/settings/rules-preview', '/api/v1/reconciliation', '/api/v1/reconciliation/proposals/{proposal_id}/confirm', '/api/v1/reconciliation/proposals/{proposal_id}/reject', '/api/v1/reconciliation/manual-match'} <= paths"

  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build React prototype
        run: npm run build

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check Tauri shell
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml
