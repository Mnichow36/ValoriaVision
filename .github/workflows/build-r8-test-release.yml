name: Build R8 standalone test release

on:
  push:
    branches:
      - "release/r8-test-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-r8:
    name: Validate R8 and stable UI regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run automated tests
        run: python -m unittest discover -s tests/reconciliation -p "test_*.py" -v

  package-windows:
    name: Build and smoke-test standalone Windows application
    needs: test-r8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked runtime and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install "pyinstaller==6.16.0"

      - name: Build standalone executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @("--noconfirm", "--clean", "--windowed", "--onefile", "--name", "Valoria Vision", "--collect-all", "plotly", "--hidden-import", "keyring.backends.Windows")
          if (Test-Path "data/runtime/plotly.min.js") {
            $arguments += @("--add-data", "data/runtime/plotly.min.js;data/runtime")
          }
          $arguments += "main.py"
          python -m PyInstaller @arguments
          $forbiddenIcu = Get-ChildItem -Path "dist" -Recurse -File | Where-Object { $_.Name -in @("icuuc.dll", "icudt78.dll") }
          if ($forbiddenIcu) {
            throw "DLL ICU parasite détectée : $($forbiddenIcu.FullName -join ', ')"
          }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "dist/Valoria Vision.exe"
          $smokeDir = Join-Path $env:RUNNER_TEMP "valoria-r8-test6-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $process = Start-Process -FilePath $exe -WorkingDirectory $smokeDir -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "L'exécutable s'est arrêté prématurément avec le code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue

      - name: Package sanitized installable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST6"
          $releaseDir = Join-Path $PWD "release"
          $packageDir = Join-Path $releaseDir $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -LiteralPath "dist/Valoria Vision.exe" -Destination (Join-Path $packageDir "Valoria Vision.exe") -Force
          @"
          VALORIA VISION V0.6.6-R8 TEST 6
          Base stable : V0.6.6-R7.2.5b validée par l'utilisateur
          Commit : $env:GITHUB_SHA
          Généré : $(Get-Date -Format "yyyy-MM-dd HH:mm:ss 'UTC'")

          Cette version est une candidate de recette, pas une version de production.

          Installation :
          1. Décompresser entièrement le ZIP dans un nouveau dossier.
          2. Ouvrir le dossier décompressé.
          3. Lancer "Valoria Vision.exe".
          4. Ne jamais écraser une installation précédente.
          5. Utiliser une copie de sauvegarde des données pour la recette.

          Non-régressions contrôlées :
          - Dashboard sans prénom codé en dur ;
          - menus contextuels du module Comptes ;
          - choix et conservation du sens Débit/Crédit ;
          - tests automatiques R8.
          "@ | Set-Content -LiteralPath (Join-Path $packageDir "LISEZ_MOI_R8_TEST6.txt") -Encoding UTF8
          $unsafe = Get-ChildItem -Path $packageDir -Recurse -File | Where-Object {
            $_.Extension -in @(".db", ".sqlite", ".sqlite3", ".vvdb", ".vvb", ".key", ".pem", ".p12", ".pfx") -or
            $_.FullName -match '[\\/](secure|backups)[\\/]'
          }
          if ($unsafe) {
            throw "Le paquet contient des données ou secrets interdits : $($unsafe.FullName -join ', ')"
          }
          $zipPath = Join-Path $releaseDir "$packageName.zip"
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath
          "$($hash.Hash.ToLower())  $packageName.zip" | Set-Content -LiteralPath (Join-Path $releaseDir "$packageName.sha256.txt") -Encoding ASCII

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST6
          path: |
            release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST6.zip
            release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST6.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish corrected GitHub prerelease
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.6-r8-test.6"
          $zip = "release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST6.zip"
          $hash = "release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST6.sha256.txt"
          @"
          Candidate de recette R8 reconstruite au-dessus de la base R7.2.5b validée.

          Corrections rétablies :
          - Dashboard sans prénom codé en dur ;
          - menus contextuels du module Comptes ;
          - choix explicite et conservation du sens Débit/Crédit.

          Le ZIP contient un exécutable Windows autonome unique : Valoria Vision.exe.
          Il ne contient aucune base, sauvegarde ou clé locale.
          "@ | Set-Content -LiteralPath "release-notes.txt" -Encoding UTF8
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip $hash --clobber
            gh release edit $tag --prerelease --target $env:GITHUB_SHA --title "Valoria Vision V0.6.6-R8 TEST 6 — exécutable unique" --notes-file "release-notes.txt"
          } else {
            gh release create $tag $zip $hash --prerelease --target $env:GITHUB_SHA --title "Valoria Vision V0.6.6-R8 TEST 6 — exécutable unique" --notes-file "release-notes.txt"
          }
