name: Build R8 test release

on:
  push:
    branches:
      - "release/r8-test-1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package-windows:
    name: Test and package Windows installable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run R8 reconciliation tests
        shell: pwsh
        run: python -m unittest discover -s tests/reconciliation -p "test_*.py" -v

      - name: Build sanitized installable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "V0_6_6_R8_TEST1"
          $packageName = "ValoriaVision_INSTALLABLE_$version"
          $releaseDir = Join-Path $PWD "release"
          $packageDir = Join-Path $releaseDir $packageName

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $forbidden = @(
            '^\.github/',
            '^tests/',
            '^release/',
            '(^|/)__pycache__/',
            '(^|/)\.venv/',
            '^data/secure/',
            '^data/backups/',
            '\.(db|sqlite|sqlite3|vvdb|vvb|key|pem|p12|pfx)$'
          )

          foreach ($relativePath in (git ls-files)) {
            $normalized = $relativePath -replace '\\', '/'
            $exclude = $false
            foreach ($pattern in $forbidden) {
              if ($normalized -match $pattern) {
                $exclude = $true
                break
              }
            }
            if ($exclude) { continue }

            $destination = Join-Path $packageDir $relativePath
            $destinationParent = Split-Path -Parent $destination
            if ($destinationParent) {
              New-Item -ItemType Directory -Force -Path $destinationParent | Out-Null
            }
            Copy-Item -LiteralPath $relativePath -Destination $destination -Force
          }

          $installPath = Join-Path $packageDir "install.bat"
          $installText = Get-Content -LiteralPath $installPath -Raw
          $installText = $installText -replace 'Installation Valoria Vision V0\.6\.6-R7\.2\.2\.1\.1', 'Installation Valoria Vision V0.6.6-R8 TEST 1'
          $installText = $installText -replace 'Correctif installation pip / dependances verrouillees', 'Release de test R8 / dependances verrouillees'
          Set-Content -LiteralPath $installPath -Value $installText -Encoding ASCII

          @"
          VALORIA VISION V0.6.6-R8 TEST 1
          Commit : $env:GITHUB_SHA
          Généré : $(Get-Date -Format "yyyy-MM-dd HH:mm:ss 'UTC'")

          Cette version est destinée à la recette fonctionnelle R8.
          Installation Windows :
          1. Décompresser intégralement le ZIP.
          2. Exécuter install.bat.
          3. Exécuter run.bat.
          4. Utiliser une copie de sauvegarde des données pour la recette.
          "@ | Set-Content -LiteralPath (Join-Path $packageDir "LISEZ_MOI_R8_TEST1.txt") -Encoding UTF8

          $required = @("main.py", "install.bat", "run.bat", "requirements-lock.txt", "app")
          foreach ($item in $required) {
            if (-not (Test-Path (Join-Path $packageDir $item))) {
              throw "Fichier requis absent du paquet : $item"
            }
          }

          $zipPath = Join-Path $releaseDir "$packageName.zip"
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $unsafeEntries = $archive.Entries | Where-Object {
              $_.FullName -match '(^|/)(secure|backups)/' -or
              $_.FullName -match '\.(db|sqlite|sqlite3|vvdb|vvb|key|pem|p12|pfx)$'
            }
            if ($unsafeEntries) {
              throw "Le ZIP contient des fichiers interdits : $($unsafeEntries.FullName -join ', ')"
            }
          }
          finally {
            $archive.Dispose()
          }

          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath
          "$($hash.Hash.ToLower())  $packageName.zip" |
            Set-Content -LiteralPath (Join-Path $releaseDir "$packageName.sha256.txt") -Encoding ASCII

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST1
          path: |
            release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST1.zip
            release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST1.sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.6-r8-test.1"
          $zip = "release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST1.zip"
          $hash = "release/ValoriaVision_INSTALLABLE_V0_6_6_R8_TEST1.sha256.txt"
          $notes = @"
          Release de recette R8, non destinée à la production.

          Contenu principal :
          - fondations du nouveau moteur de rapprochement ;
          - migration et retour arrière sécurisés ;
          - règles paramétrables et seuils de confiance ;
          - annulation auditée des rapprochements ;
          - tests automatiques exécutés avant publication.

          Installation :
          1. Télécharger puis décompresser le ZIP.
          2. Lancer install.bat.
          3. Lancer run.bat.
          4. Tester uniquement avec une copie de sauvegarde des données.
          "@
          $notes | Set-Content -LiteralPath "release-notes.txt" -Encoding UTF8

          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip $hash --clobber
          }
          else {
            gh release create $tag $zip $hash --prerelease --target $env:GITHUB_SHA --title "Valoria Vision V0.6.6-R8 TEST 1" --notes-file "release-notes.txt"
          }
