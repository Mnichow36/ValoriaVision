name: Build R7.2.4 Lot 6.2 Consolidation prévisionnel

on:
  workflow_dispatch:
  push:
    branches:
      - dev/r7.2.4-lot6.2-consolidation-previsionnel

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and test installable
        shell: pwsh
        run: |
          ./tools/build_r7_2_3_installable.ps1

      - name: Publish recipe release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Zip = Get-ChildItem "release/ValoriaVision_INSTALLABLE_V0_6_6_R7_2_4_RAPPROCHEMENTS_BETA_*.zip" | Select-Object -First 1
          $Sha = Get-ChildItem "release/ValoriaVision_INSTALLABLE_V0_6_6_R7_2_4_RAPPROCHEMENTS_BETA_*.sha256.txt" | Select-Object -First 1
          if (!$Zip -or !$Sha) { throw "Archive R7.2.4 Rapprochements beta ou empreinte SHA-256 introuvable." }
          $Tag = "recipe-r7.2.4-lot6.2-navigation-perf-" + "${{ github.run_number }}"
          gh release create $Tag $Zip.FullName $Sha.FullName --target "${{ github.sha }}" --title "Valoria Vision V0.6.6-R7.2.4 — Rapprochements beta" --notes "Archive Windows qualifiée pour la recette utilisateur des rapprochements (#49 et #82). Tests automatisés R7.2 exécutés avant publication." --prerelease
