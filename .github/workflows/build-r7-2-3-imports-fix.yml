name: Build R7.2.4 Lot 6.2 Consolidation prévisionnel

on:
  workflow_dispatch:
  push:
    branches:
      - dev/r7.2.4-lot6.2-consolidation-previsionnel

jobs:
  build-windows:
    name: Build Windows installable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and test installable
        shell: pwsh
        run: |
          ./tools/build_r7_2_3_installable.ps1

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ValoriaVision_INSTALLABLE_V0_6_6_R7_2_4_LOT6_2_NAVIGATION_PERF
          path: |
            release/ValoriaVision_INSTALLABLE_V0_6_6_R7_2_4_LOT6_2_CONSOLIDATION_PREVISIONNEL_*.zip
            release/ValoriaVision_INSTALLABLE_V0_6_6_R7_2_4_LOT6_2_CONSOLIDATION_PREVISIONNEL_*.sha256.txt
          if-no-files-found: error
